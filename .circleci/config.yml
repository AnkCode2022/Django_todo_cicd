version: 2.1

jobs:
  build:
    docker:
      - image: circleci/python:3.8
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker Image
          command: docker build -t myapp .
          command: docker images

  test:
    docker:
      - image: circleci/python:3.8
    steps:
      - checkout
      - run:
          name: Run Tests
          command: echo "Running tests"

  deploy:
    docker:
      - image: circleci/python:3.8
    steps:
      - setup_remote_docker
      - run:
          name: Run Docker Container
          command: docker run -itd -p 8082:8082 --name myapp-container myapp

workflows:
  build_test_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy:
          requires:
            - test

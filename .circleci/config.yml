version: 2.1

jobs:
  build:
    docker:
      - image: circleci/python:3.8
    steps:
      - checkout
      - run: docker build -t myapp .
  test:
    doker:
      - image: circleci/python:3.8
      - run: echo "Running tests"
  deploy:
    docker:
      - run: echo "Deploying to production"
      - run: docker run -itd --name myapp-container myapp

workflows:
  version: 2
  build_and_test_and_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy:
          requires:
            - test